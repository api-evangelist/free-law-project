openapi: 3.1.0
info:
  title: Free Law Project / CourtListener REST Alerts API
  description: The CourtListener REST API (operated by Free Law Project) provides programmatic access to case law, PACER data, the RECAP archive, oral arguments, judges, financial disclosures, citations, citation networks, alerts, tags, and visualizations.
  version: '4.3'
  contact:
    name: Free Law Project
    url: https://free.law/
servers:
- url: https://www.courtlistener.com/api/rest/v4
  description: CourtListener REST API v4
security:
- TokenAuth: []
tags:
- name: Alerts
  description: User-defined alerts on search queries.
paths:
  /alerts/:
    get:
      summary: List alerts
      operationId: listAlerts
      tags:
      - Alerts
      responses:
        '200':
          description: Paginated list of alerts.
    post:
      summary: Create an alert
      operationId: createAlert
      tags:
      - Alerts
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Alert created.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'HTTP token authentication. Format: `Token <your-token>`.'
